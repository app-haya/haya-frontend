<div class="container-fluid p-3">
  <h4 class="fw-bold mb-3">Banned Words</h4>
  <p class="text-muted mb-4">Manage all blocked words</p>

  <!-- Add new word -->
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <input
      type="text"
      class="form-control search-input"
      placeholder="Enter a new word..."
      [(ngModel)]="newWord"
    />
    <button class="btn btn-purple mt-2 mt-md-0" (click)="addWord()">
      <i class="fas fa-plus me-2"></i> Add Word
    </button>
  </div>

  <!-- Edit mode -->
  <div *ngIf="editMode" class="card p-3 mb-3">
    <h5>Edit Word</h5>
    <input [(ngModel)]="editWord" class="form-control mb-2" />
    <div class="d-flex gap-2">
      <button class="btn btn-success" (click)="updateWord()">
        <i class="fas fa-save me-1"></i> Save
      </button>
      <button class="btn btn-secondary" (click)="editMode = false">
        <i class="fas fa-times me-1"></i> Cancel
      </button>
    </div>
  </div>

  <!-- Message -->

  <!-- Words Table -->
  <div class="table-container table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Word</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let word of bannedWords">
          <td>{{ word.id }}</td>
          <td>{{ word.word }}</td>
          <td>{{ word.created_at | date : 'short' }}</td>
          <td>{{ word.updated_at | date : 'short' }}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-purple me-2" (click)="startEdit(word)">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteWord(word.id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="bannedWords.length === 0">
          <td colspan="5" class="text-center text-muted">No banned words found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
