<div class="dashboard-container" *ngIf="!loading; else loadingTpl">

  <h2 class="mb-4 fw-bold title">Admin Dashboard</h2>

  <div class="row g-4">
    
    <div class="col-md-3" *ngFor="let item of [
{ label: 'Language', value: 2, icon: 'bi-translate' },

      {label:'Pending Deals',       value: counts.pending_deals, icon:'bi-hourglass-split'},
      {label:'Approved Deals',      value: counts.approved_deals, icon:'bi-check-circle'},
      {label:'Rejected Deals',      value: counts.rejected_deals, icon:'bi-x-circle'},
      {label:'Users',               value: counts.users, icon:'bi-people'},
      {label:'Merchants',           value: counts.merchants, icon:'bi-shop'},
      {label:'Governmental Users',  value: counts.governmentals, icon:'bi-bank'},
      {label:'Cities',              value: counts.cities, icon:'bi-geo'},
      {label:'Countries',           value: counts.countries, icon:'bi-flag'},
      {label:'Interests',           value: counts.interests, icon:'bi-heart'},

    ]">

      <div class="stat-card shadow-sm">
        <div class="icon-box">
          <i class="bi" [ngClass]="item.icon"></i>
        </div>
        <div>
          <h4 class="value">{{ item.value }}</h4>
          <p class="label">{{ item.label }}</p>
        </div>
      </div>

    </div>
  </div>

</div>

<ng-template #loadingTpl>
  <div class="loading text-center py-5">
    <div class="spinner-border"></div>
    <p class="mt-3">Loading...</p>
  </div>
</ng-template>
