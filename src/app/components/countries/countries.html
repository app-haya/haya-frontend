<div class="container-fluid p-3">
  <h4 class="fw-bold mb-3">Countries</h4>
  <p class="text-muted mb-4">List of All Countries</p>

  <!-- Search + Add -->
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <input
      type="text"
      class="form-control search-input"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
    />

    <button class="btn btn-purple mt-2 mt-md-0" (click)="openAddModal()">
      <i class="fas fa-plus me-2"></i> Add Country
    </button>
  </div>

  <!-- Table -->
  <div *ngIf="!loading; else loadingSpinner" class="table-container table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let country of filteredCountries">
          <td>{{ country.name }}</td>
          <td>{{ country.created_at | date: 'short' }}</td>
          <td>{{ country.updated_at | date: 'short' }}</td>
          <td class="text-center">
       <button class="btn btn-sm btn-outline-purple me-2" (click)="editCountry(country.id)">
  <i class="fas fa-edit"></i>
</button>
            <button class="btn btn-sm btn-outline-danger" (click)="deleteCountry(country.id)">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="filteredCountries.length === 0">
          <td colspan="5" class="text-center text-muted">No countries found.</td>
        </tr>
      </tbody>
    </table>
    <!-- Pagination -->
<div class="d-flex justify-content-center align-items-center mt-4">
  <nav>
    <ul class="pagination mb-0">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <a class="page-link" (click)="prevPage()" tabindex="-1">&laquo; Prev</a>
      </li>

      <li
        class="page-item"
        *ngFor="let page of getPageNumbers()"
        [class.active]="page === currentPage"
      >
        <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
      </li>

      <li class="page-item" [class.disabled]="currentPage === lastPage">
        <a class="page-link" (click)="nextPage()">Next &raquo;</a>
      </li>
    </ul>
  </nav>
</div>

  </div>

  <!-- Loading Spinner -->
  <ng-template #loadingSpinner>
    <div class="text-center my-5">
      <div class="spinner-border text-primary"></div>
      <p class="mt-2">Loading countries...</p>
    </div>
  </ng-template>
</div>

<!-- ===== Modal Overlay & Popup ===== -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()"></div>
<div class="modal" *ngIf="showModal">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ editing ? 'Edit Country' : 'Add Country' }}</h3>
      <button class="close-btn" (click)="closeModal()">✕</button>
    </div>

    <form (ngSubmit)="saveCountry()" class="country-form">
      <div class="form-group">
        <label for="name_en">Name (English)</label>
        <input type="text" id="name_en" [(ngModel)]="formData.name_en" name="name_en" required />
      </div>

      <div class="form-group">
        <label for="name_ar">Name (Arabic)</label>
        <input type="text" id="name_ar" [(ngModel)]="formData.name_ar" name="name_ar" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-purple">{{ editing ? 'Update' : 'Add' }}</button>
        <button type="button" class="btn btn-outline" (click)="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>
