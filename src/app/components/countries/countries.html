<div class="container-fluid p-3">
  <h4 class="fw-bold mb-3">Countries</h4>
  <p class="text-muted mb-4">List of All Countries</p>

  <!-- Search + Add -->
  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
    <input
      type="text"
      class="form-control search-input"
      placeholder="Search..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
    />

    <button class="btn btn-purple mt-2 mt-md-0" (click)="openAddModal()">
      <i class="fas fa-plus me-2"></i> Add Country
    </button>
  </div>

  <!-- TABLE -->
  <div *ngIf="!loading; else spinner" class="table-container table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Name</th>
          <th>Created At</th>
          <th>Updated At</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let country of filteredCountries">
          <td>{{ country.name }}</td>
          <td>{{ country.created_at | date : 'short' }}</td>
          <td>{{ country.updated_at | date : 'short' }}</td>

          <td class="text-center">
            <button
              class="btn btn-sm btn-outline-purple me-2"
              (click)="editCountry(country.id)"
            >
              <i class="fas fa-edit"></i>
            </button>

            <button
              class="btn btn-sm btn-outline-danger"
              (click)="deleteCountry(country.id)"
            >
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>

        <tr *ngIf="filteredCountries.length === 0">
          <td colspan="7" class="text-center text-muted">
            No countries found.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div
    class="pagination-wrapper d-flex justify-content-center align-items-center mt-4"
    *ngIf="lastPage > 1"
  >
    <button class="btn btn-outline-purple me-2" (click)="prevPage()" [disabled]="currentPage === 1">
      Prev
    </button>

    <button
      class="btn btn-light mx-1"
      *ngFor="let page of getPageNumbers()"
      [class.active-page]="page === currentPage"
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>

    <button
      class="btn btn-outline-purple ms-2"
      (click)="nextPage()"
      [disabled]="currentPage === lastPage"
    >
      Next
    </button>
  </div>

</div>


<!-- ✅ LOADING SPINNER TEMPLATE -->
<ng-template #spinner>
  <div class="d-flex justify-content-center py-5">
    <div class="spinner"></div>
  </div>
</ng-template>
