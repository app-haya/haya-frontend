<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 py-3">
          <div class="d-flex align-items-center">
            <button class="btn btn-link text-purple p-0 me-3" [routerLink]="['/gifts']">
              <i class="bi bi-arrow-left fs-4"></i>
            </button>
            <h4 class="fw-bold text-purple mb-0">{{ 'Edit Gift' | translate }}</h4>
          </div>
        </div>
        <div class="card-body p-4">
          <div *ngIf="loading && !giftForm.value.name" class="text-center py-5">
             <div class="spinner-border text-purple"></div>
          </div>
          <form *ngIf="!loading || giftForm.value.name" [formGroup]="giftForm" (ngSubmit)="onSubmit()">
            <div class="row g-3">
              <!-- Name -->
              <div class="col-md-12">
                <label class="form-label fw-bold small">{{ 'Gift Name' | translate }}</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="name"
                  [placeholder]="'Enter gift name' | translate"
                  [class.is-invalid]="giftForm.get('name')?.touched && giftForm.get('name')?.invalid"
                />
              </div>

              <!-- Price -->
              <div class="col-md-6">
                <label class="form-label fw-bold small">{{ 'Price' | translate }}</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="price"
                  [placeholder]="'0.00' | translate"
                  [class.is-invalid]="giftForm.get('price')?.touched && giftForm.get('price')?.invalid"
                />
              </div>

              <!-- Status -->
              <div class="col-md-6">
                <label class="form-label fw-bold small">{{ 'Status' | translate }}</label>
                <select class="form-select" formControlName="is_active">
                  <option value="1">{{ 'Active' | translate }}</option>
                  <option value="0">{{ 'Inactive' | translate }}</option>
                </select>
              </div>

              <!-- Image Upload -->
              <div class="col-md-12">
                <label class="form-label fw-bold small">{{ 'Gift Image' | translate }}</label>
                <div class="image-upload-container border rounded p-4 text-center bg-light">
                  <input
                    type="file"
                    class="d-none"
                    #fileInput
                    (change)="onFileChange($event)"
                    accept="image/*"
                  />
                  <div *ngIf="!imagePreview" (click)="fileInput.click()" style="cursor: pointer;">
                    <i class="bi bi-cloud-arrow-up fs-1 text-purple"></i>
                    <p class="mb-0 text-muted">{{ 'Click to upload or drag and drop' | translate }}</p>
                  </div>
                  <div *ngIf="imagePreview" class="position-relative d-inline-block">
                    <img [src]="imagePreview" class="rounded img-thumbnail" style="max-height: 200px;">
                    <button type="button" 
                            class="btn btn-danger btn-sm position-absolute top-0 end-0 m-2 rounded-circle"
                            (click)="imagePreview = null; imageFile = null">
                      <i class="bi bi-x"></i>
                    </button>
                    <div class="mt-2">
                       <button type="button" class="btn btn-sm btn-outline-purple" (click)="fileInput.click()">
                         {{ 'Change Image' | translate }}
                       </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-light px-4" [routerLink]="['/gifts']">
                {{ 'Cancel' | translate }}
              </button>
              <button type="submit" class="btn btn-purple px-5" [disabled]="loading || giftForm.invalid">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                {{ 'Update Gift' | translate }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
