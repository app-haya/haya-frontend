<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="title mb-4 text-center">Edit Admin</h4>

      <form (ngSubmit)="updateAdmin()" class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" [(ngModel)]="admin.name" name="name" required>
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="admin.email" name="email" required>
        </div>

        <!-- Password -->
        <div class="col-md-6">
          <label class="form-label">Password (leave empty to keep current)</label>
          <input type="password" class="form-control" [(ngModel)]="admin.password" name="password">
        </div>

        <!-- Phone -->
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" [(ngModel)]="admin.phone" name="phone">
        </div>



        <!-- Super Admin -->
        <div class="col-md-6 mt-3">
          <label class="form-label">Super Admin</label>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              [(ngModel)]="admin.is_super_admin"
              name="is_super_admin"
              (ngModelChange)="toggleSuperAdmin($event)"
            />
            <label class="form-check-label">Is Super Admin?</label>
          </div>
        </div>

        <!-- Roles -->
        <div class="col-md-6 mt-3" *ngIf="!admin.is_super_admin">
          <label class="form-label">Roles</label>
          <div *ngFor="let role of roles" class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              (change)="toggleRole(role.id, $event.target.checked)"
              [checked]="admin.roles?.includes(role.id)"
            />
            <label class="form-check-label">{{ role.name }}</label>
          </div>
        </div>

        <!-- Current Image -->
        <div class="col-md-6" *ngIf="admin.image_url && !imagePreview">
          <label class="form-label">Current Image</label>
          <div class="mb-2">
            <img [src]="admin.image_url" class="img-thumbnail" style="max-width: 150px;">
          </div>
        </div>

        <!-- New Image Preview -->
        <div class="col-md-6" *ngIf="imagePreview">
          <label class="form-label">New Image Preview</label>
          <div class="mb-2">
            <img [src]="imagePreview" class="img-thumbnail" style="max-width: 150px;">
          </div>
        </div>

        <!-- Upload New Image -->
        <div class="col-md-6">
          <label class="form-label">Change Image</label>
          <input type="file" class="form-control" (change)="onFileChange($event)">
        </div>

        <!-- Submit Button -->
        <div class="col-12 text-center mt-3">
          <button type="submit" class="btn btn-purple mt-2 mt-md-0">
            <i class="fas fa-save me-2"></i> Update Admin
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
