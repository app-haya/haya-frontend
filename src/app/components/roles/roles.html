<div class="container-fluid p-3">  <h4 class="fw-bold mb-3">{{ 'Roles' | translate }}</h4>  <p class="text-muted mb-4">{{ 'List of All Roles' | translate }}</p>  <div class="d-flex justify-content-between align-items-center flex-wrap mb-3 gap-2">    <input      type="text"      class="form-control search-input"      [placeholder]="'Search by name...' | translate"      [(ngModel)]="searchTerm"      (input)="filterRoles()"    />    <button class="btn btn-purple" (click)="openAddModal()">      <i class="fas fa-plus me-2"></i>{{ 'Add Role' | translate }}    </button>  </div>  <div *ngIf="loading" class="text-center my-4">    <div class="spinner-border text-primary"></div>  </div>  <div class="table-container table-responsive" *ngIf="!loading">    <table class="table table-hover align-middle">      <thead>        <tr>          <th>{{ 'Role Name' | translate }}</th>          <th class="text-center">{{ 'Actions' | translate }}</th>        </tr>      </thead>      <tbody>        <tr *ngFor="let role of filteredRoles">          <td>{{ role.name }}</td>          <td class="text-center">            <button class="btn btn-sm btn-outline-purple me-2" (click)="openEditModal(role)">              <i class="fas fa-edit"></i>            </button>            <button class="btn btn-sm btn-outline-danger" (click)="deleteRole(role.id)">              <i class="fas fa-trash-alt"></i>            </button>          </td>        </tr>        <tr *ngIf="filteredRoles.length === 0">          <td colspan="2" class="text-center text-muted">{{ 'No roles found.' | translate }}</td>        </tr>      </tbody>    </table>  </div></div><div class="modal-overlay" *ngIf="showModal" (click)="showModal = false"></div><div class="modal" *ngIf="showModal">  <div class="modal-content" (click)="$event.stopPropagation()">    <div class="modal-header">      <h3>{{ modalTitle }}</h3>      <button class="close-btn" (click)="showModal = false">✕</button>    </div>    <form (ngSubmit)="saveRole()" class="city-form">      <div class="form-group">        <label>{{ 'Role Name' | translate }}</label>        <input type="text" [(ngModel)]="formData.name" name="name" required />      </div>      <div class="form-actions">        <button class="btn btn-purple" type="submit">{{ 'Save' | translate }}</button>        <button class="btn btn-outline" type="button" (click)="showModal = false">{{ 'Cancel' | translate }}</button>      </div>    </form>  </div></div>
