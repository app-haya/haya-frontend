<div class="container py-4">  <h3 class="mb-4 fw-bold text-center text-pule">{{ 'Add Governmental' | translate }}</h3>  <form    [formGroup]="governmentalForm"    (ngSubmit)="onSubmit()"    enctype="multipart/form-data"  >    <div class="row g-4">      <div class="col-md-4">        <label class="form-label">{{ 'Government Name' | translate }}</label>        <input formControlName="name" class="form-control styled-input" />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Owner Name' | translate }}</label>        <input formControlName="owner_name" class="form-control styled-input" />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Email' | translate }}</label>        <input          type="email"          formControlName="email"          class="form-control styled-input"        />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Phone' | translate }}</label>        <input formControlName="phone" class="form-control styled-input" />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Activity' | translate }}</label>        <input formControlName="activity" class="form-control styled-input" />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'ID Number' | translate }}</label>        <input formControlName="id_num" class="form-control styled-input" />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Birth Date' | translate }}</label>        <input          type="date"          formControlName="birth_date"          class="form-control styled-input"        />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Expiration Date' | translate }}</label>        <input          type="date"          formControlName="expiration_date"          class="form-control styled-input"        />      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Account Type' | translate }}</label>        <select formControlName="account_type" class="form-select styled-input">          <option value="governmental">{{ 'Governmental' | translate }}</option>          <option value="merchant">{{ 'Merchant' | translate }}</option>          <option value="doctor">{{ 'Doctor' | translate }}</option>          <option value="patient">{{ 'Patient' | translate }}</option>        </select>      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Is Active' | translate }}</label>        <select formControlName="is_active" class="form-select styled-input">          <option value="1">{{ 'Active' | translate }}</option>          <option value="0">{{ 'Inactive' | translate }}</option>        </select>      </div>      <div class="col-md-4">        <label class="form-label">{{ 'Country' | translate }}</label>        <select          class="form-select styled-input"          formControlName="country_id"          (change)="onCountryChange($event)"        >          <option value="">{{ 'Select Country' | translate }}</option>          <option *ngFor="let country of countries" [value]="country.id">            {{ country.name }}          </option>        </select>      </div>      <div class="col-md-4">        <label class="form-label">{{ 'City' | translate }}</label>        <select class="form-select styled-input" formControlName="city_id">          <option value="">{{ 'Select City' | translate }}</option>          <option *ngFor="let city of cities" [value]="city.id">            {{ city.name }}          </option>        </select>      </div>      <div class="col-12">        <label class="form-label d-block mb-2">{{ 'Interests' | translate }}</label>        <div class="d-flex flex-wrap gap-3">          <div *ngFor="let interest of interestsList" class="form-check me-4">            <input              class="form-check-input"              type="checkbox"              [value]="interest.id"              (change)="onInterestChange($event)"              id="interest-{{ interest.id }}"            />            <label class="form-check-label" for="interest-{{ interest.id }}">              {{ interest.name_en }} ({{ interest.name_ar }})            </label>          </div>        </div>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Store Logo' | translate }}</label>        <input          type="file"          (change)="onFileChange($event, 'Store_logo')"          class="form-control styled-input"        />      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Commercial Register' | translate }}</label>        <input          type="file"          (change)="onFileChange($event, 'commercial_register')"          class="form-control styled-input"        />      </div>      <div class="col-12 text-center mt-3">        <button type="submit" class="btn btn-primary px-5 py-2" [disabled]="loading">          {{ loading ? ('Saving...' | translate) : ('Add Governmental' | translate) }}        </button>      </div>    </div>  </form></div>
