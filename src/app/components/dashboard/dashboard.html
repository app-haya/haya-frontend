<div class="dashboard-layout">
  <div class="sidebar-wrapper" [class.collapsed]="isCollapsed">
    <app-sidebar [isCollapsed]="isCollapsed" (collapsedChange)="isCollapsed = $event"></app-sidebar>
  </div>
  <div class="main-content">
    <div class="sticky-top">
      <app-navbar (sidebarToggle)="toggleSidebar()" (darkModeChange)="onDarkModeChange($event)"></app-navbar>
    </div>
    <div class="content-area p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
