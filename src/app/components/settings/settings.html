<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="header-card p-4 rounded-4 mb-4 shadow-sm custom-border"
           [style.background-color]="isDarkMode ? '#161b22' : '#fff'">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h4 class="mb-1 fw-bold">{{ 'SETTINGS' | translate }}</h4>
            <p class="mb-0 small">{{ 'MANAGE_POLICIES_AND_TERMS' | translate }}</p>
          </div>
          <div class="d-flex gap-2">
            <button *ngIf="settingsId" class="btn btn-outline-danger rounded-pill px-4" (click)="deleteSettings()">
              <i class="bi bi-trash me-2"></i>{{ 'DELETE_ALL' | translate }}
            </button>
            <button class="btn rounded-pill px-4 d-flex align-items-center" 
                    (click)="saveSettings()"
                    [style.background-color]="isDarkMode ? '#00cfd5' : '#7a3ca0'"
                    [style.color]="isDarkMode ? '#000' : '#fff'"
                    [style.border]="'none'"
                    [disabled]="submitting">
              <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
              <i *ngIf="!submitting" class="bi bi-save me-2"></i>
              {{ 'SAVE_CHANGES' | translate }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner-ring"></div>
  </div>

  <div *ngIf="!loading" class="settings-tabs">
    <button type="button" class="tab-btn" [class.active]="activeTab === 'terms'" (click)="setActiveTab('terms')">
      <i class="bi bi-file-earmark-text"></i>
      <span>{{ 'TERMS_AND_CONDITIONS' | translate }}</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="activeTab === 'privacy'" (click)="setActiveTab('privacy')">
      <i class="bi bi-shield-check"></i>
      <span>{{ 'PRIVACY_POLICY' | translate }}</span>
    </button>
    <button type="button" class="tab-btn" [class.active]="activeTab === 'about'" (click)="setActiveTab('about')">
      <i class="bi bi-info-circle"></i>
      <span>{{ 'ABOUT_US' | translate }}</span>
    </button>
  </div>

  <form [formGroup]="settingsForm" *ngIf="!loading">
    <div class="row g-4">
      <!-- Terms & Conditions Section -->
      <div class="col-12" *ngIf="activeTab === 'terms'">
        <div class="card shadow-none rounded-4 overflow-hidden custom-border"
             [style.background-color]="isDarkMode ? '#161b22' : '#fff'">
          <div class="card-header py-3 bg-transparent custom-border-bottom">
            <h5 class="mb-0 fw-bold"><i class="bi bi-file-earmark-text me-2"></i>{{ 'TERMS_AND_CONDITIONS' | translate }}</h5>
          </div>
          <div class="card-body p-4">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'TERMS_AR' | translate }}</label>
                <textarea id="terms_ar_editor" class="form-control rounded-3" formControlName="terms_and_conditions_ar" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_TERMS_AR' | translate }}"></textarea>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'TERMS_EN' | translate }}</label>
                <textarea id="terms_en_editor" class="form-control rounded-3" formControlName="terms_and_conditions_en" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_TERMS_EN' | translate }}"></textarea>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالعربية)</label>
                <input type="text" class="form-control rounded-3" formControlName="terms_updated_date_ar"
                  placeholder="مثال: آخر تحديث في 17 مايو 2026">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالإنجليزية)</label>
                <input type="text" class="form-control rounded-3" formControlName="terms_updated_date_en"
                  placeholder="مثال: Last updated on May 17, 2026">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Privacy Policy Section -->
      <div class="col-12" *ngIf="activeTab === 'privacy'">
        <div class="card shadow-none rounded-4 overflow-hidden custom-border"
             [style.background-color]="isDarkMode ? '#161b22' : '#fff'">
          <div class="card-header py-3 bg-transparent custom-border-bottom">
            <h5 class="mb-0 fw-bold"><i class="bi bi-shield-check me-2"></i>{{ 'PRIVACY_POLICY' | translate }}</h5>
          </div>
          <div class="card-body p-4">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'PRIVACY_AR' | translate }}</label>
                <textarea id="privacy_ar_editor" class="form-control rounded-3" formControlName="privacy_policy_ar" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_PRIVACY_AR' | translate }}"></textarea>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'PRIVACY_EN' | translate }}</label>
                <textarea id="privacy_en_editor" class="form-control rounded-3" formControlName="privacy_policy_en" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_PRIVACY_EN' | translate }}"></textarea>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالعربية)</label>
                <input type="text" class="form-control rounded-3" formControlName="privacy_updated_date_ar"
                  placeholder="مثال: آخر تحديث في 17 مايو 2026">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالإنجليزية)</label>
                <input type="text" class="form-control rounded-3" formControlName="privacy_updated_date_en"
                  placeholder="مثال: Last updated on May 17, 2026">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- About Us Section -->
      <div class="col-12" *ngIf="activeTab === 'about'">
        <div class="card shadow-none rounded-4 overflow-hidden custom-border"
             [style.background-color]="isDarkMode ? '#161b22' : '#fff'">
          <div class="card-header py-3 bg-transparent custom-border-bottom">
            <h5 class="mb-0 fw-bold"><i class="bi bi-info-circle me-2"></i>{{ 'ABOUT_US' | translate }}</h5>
          </div>
          <div class="card-body p-4">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'ABOUT_AR' | translate }}</label>
                <textarea id="about_ar_editor" class="form-control rounded-3" formControlName="about_us_ar" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_ABOUT_AR' | translate }}"></textarea>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">{{ 'ABOUT_EN' | translate }}</label>
                <textarea id="about_en_editor" class="form-control rounded-3" formControlName="about_us_en" rows="8"
                  (input)="adjustTextareas()" placeholder="{{ 'ENTER_ABOUT_EN' | translate }}"></textarea>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالعربية)</label>
                <input type="text" class="form-control rounded-3" formControlName="about_updated_date_ar"
                  placeholder="مثال: آخر تحديث في 17 مايو 2026">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">تاريخ التحديث (بالإنجليزية)</label>
                <input type="text" class="form-control rounded-3" formControlName="about_updated_date_en"
                  placeholder="مثال: Last updated on May 17, 2026">
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </form>
</div>
