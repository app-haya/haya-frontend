<div class="login-page">
  <div id="particles-js" class="particles"></div>
  <div class="login-wrapper shadow-lg">
    <!-- Left Form Side -->
    <div class="login-form-side" dir="rtl">
      <h2 class="login-title">{{ 'تسجيل الدخول' }}</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">

        <!-- Email Input -->
        <div class="input-container">
          <input type="email" name="email" class="custom-input" placeholder="admin@example.com" [(ngModel)]="form.email"
            required dir="ltr" />
          <i class="fas fa-envelope input-icon"></i>
        </div>

        <!-- Password Input -->
        <div class="input-container">
          <input type="password" name="password" class="custom-input" placeholder="........."
            [(ngModel)]="form.password" required dir="ltr" />
          <i class="fas fa-lock input-icon"></i>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="remember-me">
          <label class="remember-label">
            <span class="remember-text">تذكرني</span>
            <input type="checkbox" name="remember" class="remember-checkbox">
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" [disabled]="!loginForm.valid">
          {{ 'تسجيل الدخول' }}
        </button>
      </form>
    </div>

    <!-- Right Image Side -->
    <div class="login-image-side">
      <img src="/images/HayaLogo-DhdEv8BC.jpg" alt="Logo" class="logo-img" />
    </div>
  </div>
</div>
