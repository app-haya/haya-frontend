<div class="particles" id="particles"></div>

<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-5 border-0 login-card">
    <div class="row g-5 align-items-center">

      <!-- Left side -->
      <div class="col-md-6 text-center">
        <img 
          src="/images/HayaLogo-DhdEv8BC.jpg"
          alt="Haya Logo"
          class="img-fluid rounded shadow-sm login-image"
        />
      </div>

      <!-- Right side -->
      <div class="col-md-6 px-4">
        <h3 class="text-center text-purple mb-4 fw-bold">Log In</h3>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

          <!-- Email -->
          <div class="mb-4">
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0">
                <i class="fas fa-envelope text-purple"></i>
              </span>
              <input
                type="email"
                name="email"
                class="form-control form-control-lg border-start-0"
                placeholder="Email"
                [(ngModel)]="form.email"
                required
              />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0">
                <i class="fas fa-lock text-purple"></i>
              </span>
              <input
                type="password"
                name="password"
                class="form-control form-control-lg border-start-0"
                placeholder="Password"
                [(ngModel)]="form.password"
                required
              />
            </div>
          </div>

          <!-- Button -->
          <div class="text-center mt-5">
            <button 
              type="submit"
              class="btn btn-outline-purple btn-lg w-100"
              [disabled]="!loginForm.valid">
              LOG IN
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
