<nav class="navbar navbar-expand p-2 px-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <!-- Sidebar Toggle Button (At the beginning) -->
    <div class="d-flex align-items-center">
      <button class="icon-action" (click)="toggleSidebar()" title="Toggle Sidebar">
        <i class="bi bi-list"></i>
      </button>
    </div>
    

    
    <!-- Icons Container -->
    <div class="icons-container position-relative">
      
      <!-- Language Dropdown -->
      <div class="dropdown m-0 p-0 position-relative">
        <button class="icon-action" (click)="toggleDropdown()" title="Language">
          <i class="bi bi-globe"></i>
        </button>
        <ul *ngIf="showLangDropdown" class="dropdown-menu show" style="position:absolute; right:0; top: 120%; z-index: 1000; min-width: auto !important; width: max-content;">
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2" style="cursor: pointer" (click)="changeLang('en')">
              <img src="https://flagcdn.com/w40/us.png" alt="US Flag" style="width: 25px; height: auto; border-radius: 2px; border: 1px solid rgba(0, 0, 0, 0.12); box-shadow: 0 1px 2px rgba(0,0,0,0.08);">
              <span>{{ 'ENGLISH' | translate }}</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center gap-2" style="cursor: pointer" (click)="changeLang('ar')">
              <img src="https://flagcdn.com/w40/sa.png" alt="Saudi Flag" style="width: 25px; height: auto; border-radius: 2px; border: 1px solid rgba(0, 0, 0, 0.12); box-shadow: 0 1px 2px rgba(0,0,0,0.08);">
              <span>{{ 'عربي' | translate }}</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Settings -->
      <button class="icon-action d-none d-md-flex" title="Settings">
        <i class="bi bi-gear"></i>
      </button>

      <!-- Notifications -->
      <button class="icon-action d-none d-md-flex" title="Notifications">
        <i class="bi bi-bell"></i>
      </button>

      <!-- Dark Mode -->
      <button class="icon-action" (click)="toggleDarkMode()" title="Toggle Dark Mode">
        <i [ngClass]="isDarkMode ? 'bi bi-moon-stars' : 'bi bi-sun'"></i>
      </button>

      <!-- User Profile Pill -->
      <button class="user-pill d-none d-md-flex align-items-center">
        <i class="bi bi-person-circle fs-5 mx-1"></i>
        <span class="mx-1 fs-6">{{ translate.currentLang === 'en' ? 'Admin' : 'المدير' }}</span>
        <i class="bi bi-chevron-down mx-1" style="font-size: 10px;"></i>
      </button>

    </div>
  </div>
</nav>
