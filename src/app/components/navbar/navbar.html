<nav class="navbar navbar-expand bg-purple p-2 px-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <div class="search-box d-flex align-items-center">
      <i class="bi bi-search text-white me-2"></i>
      <input type="text" [placeholder]="'SEARCH' | translate" class="form-control form-control-sm" />
    </div>

    <div class="icons text-white d-flex align-items-center position-relative">
      <i class="bi bi-sun me-3"></i>
      <i class="bi bi-bell me-3"></i>
      <i class="bi bi-gear me-3"></i>
      <i class="bi bi-person me-3"></i>

      <div class="dropdown">
        <button class="btn btn-light btn-sm" (click)="toggleDropdown()">
          {{ translate.currentLang === 'en' ? 'ENGLISH' : 'عربي' }}
        </button>
        <ul *ngIf="showLangDropdown" class="dropdown-menu show" style="position:absolute; right:0;">
          <li><a class="dropdown-item" (click)="changeLang('en')">ENGLISH</a></li>
          <li><a class="dropdown-item" (click)="changeLang('ar')">عربي</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
