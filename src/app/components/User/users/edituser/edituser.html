<div class="container py-4">  <h3 class="mb-4 fw-bold text-center text-purple">{{ 'Edit User' | translate }}</h3>  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">    <div class="row g-4">      <div class="col-md-6">        <label class="form-label">{{ 'Name' | translate }}</label>        <input type="text" formControlName="name" class="form-control styled-input" [placeholder]="'Enter name' | translate" />      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Email' | translate }}</label>        <input type="email" formControlName="email" class="form-control styled-input" [placeholder]="'Enter email' | translate" />      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Phone' | translate }}</label>        <input type="text" formControlName="phone" class="form-control styled-input" [placeholder]="'Enter phone' | translate" />      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Birth Date' | translate }}</label>        <input type="date" formControlName="birth_date" class="form-control styled-input" />      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Country' | translate }}</label>        <select class="form-select styled-input" formControlName="country_id" (change)="onCountryChange($event)">          <option value="">{{ 'Select Country' | translate }}</option>          <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>        </select>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'City' | translate }}</label>        <select class="form-select styled-input" formControlName="city_id">          <option value="">{{ 'Select City' | translate }}</option>          <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>        </select>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Gender' | translate }}</label>        <select class="form-select styled-input" formControlName="gender">          <option value="">{{ 'Select gender' | translate }}</option>          <option value="1">{{ 'Male' | translate }}</option>          <option value="2">{{ 'Female' | translate }}</option>        </select>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Account Type' | translate }}</label>        <select class="form-select styled-input" formControlName="account_type">          <option value="user">{{ 'User' | translate }}</option>          <option value="admin">{{ 'Admin' | translate }}</option>        </select>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Status' | translate }}</label>        <select class="form-select styled-input" formControlName="is_active">          <option value="1">{{ 'Active' | translate }}</option>          <option value="0">{{ 'Inactive' | translate }}</option>        </select>      </div>      <div class="col-md-6">        <label class="form-label">{{ 'Interests' | translate }}</label>        <div class="d-flex flex-wrap gap-3">          <div class="form-check" *ngFor="let interest of interestsList">            <input              type="checkbox"              class="form-check-input"              [value]="interest.id"              (change)="onInterestChange($event)"              [checked]="userForm.value.interests?.includes(interest.id)"              id="interest-{{ interest.id }}"            />            <label class="form-check-label" for="interest-{{ interest.id }}">              {{ interest.name }}            </label>          </div>        </div>      </div>      <div class="col-12">        <label class="form-label">{{ 'User Image' | translate }}</label>        <input type="file" class="form-control styled-input" (change)="onFileChange($event)" accept="image/*" />        <div class="mt-3" *ngIf="userImageUrl || userForm.value.image">          <img            [src]="userForm.value.image || userImageUrl"            class="img-thumbnail rounded-3 shadow-sm"            width="120"            alt="User"          />        </div>      </div>      <div class="col-12 text-center mt-4">        <button type="submit" class="btn btn-purple px-5 py-2" [disabled]="loading || userForm.invalid">          {{ loading ? ('Updating...' | translate) : ('Update User' | translate) }}        </button>      </div>    </div>  </form></div>
