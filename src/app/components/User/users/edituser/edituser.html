<div class="container py-4">
  <h3 class="mb-4 fw-bold text-center text-purple">Edit User</h3>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div class="row g-4">

      <!-- Name -->
      <div class="col-md-6">
        <label class="form-label">Name</label>
        <input type="text" formControlName="name" class="form-control styled-input" placeholder="Enter name" />
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input type="email" formControlName="email" class="form-control styled-input" placeholder="Enter email" />
      </div>

      <!-- Phone -->
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input type="text" formControlName="phone" class="form-control styled-input" placeholder="Enter phone" />
      </div>

      <!-- Birth date -->
      <div class="col-md-6">
        <label class="form-label">Birth Date</label>
        <input type="date" formControlName="birth_date" class="form-control styled-input" />
      </div>

      <!-- Country -->
      <div class="col-md-6">
        <label class="form-label">Country</label>
        <select class="form-select styled-input" formControlName="country_id" (change)="onCountryChange($event)">
          <option value="">Select Country</option>
          <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
        </select>
      </div>

      <!-- City -->
      <div class="col-md-6">
        <label class="form-label">City</label>
        <select class="form-select styled-input" formControlName="city_id">
          <option value="">Select City</option>
          <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
        </select>
      </div>

      <!-- Gender -->
      <div class="col-md-6">
        <label class="form-label">Gender</label>
        <select class="form-select styled-input" formControlName="gender">
          <option value="">Select gender</option>
          <option value="1">Male</option>
          <option value="2">Female</option>
        </select>
      </div>

      <!-- Account type -->
      <div class="col-md-6">
        <label class="form-label">Account Type</label>
        <select class="form-select styled-input" formControlName="account_type">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <!-- Status -->
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-select styled-input" formControlName="is_active">
          <option value="1">Active</option>
          <option value="0">Inactive</option>
        </select>
      </div>

      <!-- Interests -->
      <div class="col-md-6">
        <label class="form-label">Interests</label>
        <div class="d-flex flex-wrap gap-3">
          <div class="form-check" *ngFor="let interest of interestsList">
            <input
              type="checkbox"
              class="form-check-input"
              [value]="interest.id"
              (change)="onInterestChange($event)"
              [checked]="userForm.value.interests?.includes(interest.id)"
              id="interest-{{ interest.id }}"
            />
            <label class="form-check-label" for="interest-{{ interest.id }}">
              {{ interest.name }}
            </label>
          </div>
        </div>
      </div>

      <!-- Image Upload -->
      <div class="col-12">
        <label class="form-label">User Image</label>
        <input type="file" class="form-control styled-input" (change)="onFileChange($event)" accept="image/*" />
        
        <div class="mt-3" *ngIf="userImageUrl || userForm.value.image">
          <img
            [src]="userForm.value.image || userImageUrl"
            class="img-thumbnail rounded-3 shadow-sm"
            width="120"
            alt="User"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <div class="col-12 text-center mt-4">
        <button type="submit" class="btn btn-purple px-5 py-2" [disabled]="loading || userForm.invalid">
          {{ loading ? 'Updating...' : 'Update User' }}
        </button>
      </div>

    </div>
  </form>
</div>
