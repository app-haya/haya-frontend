<div class="container-fluid py-4">
  <div class="add-user-card mx-auto">
    <div class="card-header-gradient text-center">
      <h3 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>{{ 'Add User' | translate }}</h3>
      <p class="small opacity-75 mb-0">{{ 'Register a new user to the platform' | translate }}</p>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="form-group-container">
      
      <!-- Section 1: Identity -->
      <div class="mb-5">
        <h5 class="section-title">
          <i class="bi bi-person-badge"></i>
          {{ 'Identity' | translate }}
        </h5>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">{{ 'Name' | translate }}</label>
            <input type="text" class="form-control styled-input" [placeholder]="'Enter full name' | translate" formControlName="name" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Email' | translate }}</label>
            <input type="email" class="form-control styled-input" [placeholder]="'example@domain.com' | translate" formControlName="email" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Phone' | translate }}</label>
            <input type="text" class="form-control styled-input" [placeholder]="'+966...' | translate" formControlName="phone" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Birth Date' | translate }}</label>
            <input type="date" class="form-control styled-input" formControlName="birth_date" />
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Gender' | translate }}</label>
            <select class="form-select styled-input" formControlName="gender">
              <option value="">{{ 'Select Gender' | translate }}</option>
              <option value="1">{{ 'Male' | translate }}</option>
              <option value="2">{{ 'Female' | translate }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section 2: Account Settings -->
      <div class="mb-5">
        <h5 class="section-title">
          <i class="bi bi-shield-lock"></i>
          {{ 'Account Settings' | translate }}
        </h5>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">{{ 'Country' | translate }}</label>
            <select class="form-select styled-input" formControlName="country_id" (change)="onCountryChange($event)">
              <option value="">{{ 'Select Country' | translate }}</option>
              <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'City' | translate }}</label>
            <select class="form-select styled-input" formControlName="city_id">
              <option value="">{{ 'Select City' | translate }}</option>
              <option *ngFor="let city of cities" [value]="city.id">{{ city.name }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Account Type' | translate }}</label>
            <select class="form-select styled-input" formControlName="type">
              <option value="">{{ 'Select Type' | translate }}</option>
              <option value="user">{{ 'User' | translate }}</option>
              <option value="admin">{{ 'Admin' | translate }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">{{ 'Status' | translate }}</label>
            <select class="form-select styled-input" formControlName="is_active">
              <option value="1">{{ 'Active' | translate }}</option>
              <option value="0">{{ 'Inactive' | translate }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section 3: Interests & Profile -->
      <div class="mb-5">
        <h5 class="section-title">
          <i class="bi bi-heart"></i>
          {{ 'Interests & Profile' | translate }}
        </h5>
        <div class="row g-4">
          <div class="col-12">
            <label class="form-label mb-3">{{ 'Interests' | translate }}</label>
            <div class="d-flex flex-wrap gap-2">
              <div class="interest-tag" *ngFor="let interest of interestsList" 
                   [class.active]="userForm.value.interests.includes(interest.id)"
                   (click)="toggleInterest(interest.id)">
                <i class="bi" [class.bi-check2]="userForm.value.interests.includes(interest.id)" 
                   [class.bi-plus]="!userForm.value.interests.includes(interest.id)"></i>
                {{ interest.name }}
              </div>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">{{ 'User Image' | translate }}</label>
            <div class="file-input-wrapper">
              <input type="file" class="form-control d-none" #fileInput (change)="onFileChange($event)" />
              <button type="button" class="btn btn-outline-secondary w-100 py-3 border-0" (click)="fileInput.click()">
                <i class="bi bi-camera fs-4 d-block mb-1"></i>
                {{ userImageName ? userImageName : ('Click to upload profile image' | translate) }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center pt-4">
        <button type="submit" class="submit-btn px-5 py-3 fs-5 w-100" [disabled]="loading || userForm.invalid">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? ('Processing...' | translate) : ('Register User' | translate) }}
        </button>
      </div>

    </form>
  </div>
</div>
